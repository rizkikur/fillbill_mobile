name: fillbill_mobile
description: "FillBill - Financial-grade PPOB Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Networking & HTTP
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Navigation & Routing
  go_router: ^14.6.3

  # Security & Storage
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # Utilities & Helpers
  intl: ^0.19.0
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
